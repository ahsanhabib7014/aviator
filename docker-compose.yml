services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockertest_app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PIN: ${ADMIN_PIN}
      ADMIN_SEED_SECRET: ${ADMIN_SEED_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET}
      CRON_SECRET: ${CRON_SECRET}
    restart: unless-stopped

  cron:
    image: alpine:3.20
    container_name: dockertest_cron
    depends_on:
      - app
    environment:
      TZ: Asia/Dhaka
      CRON_SECRET: ${CRON_SECRET}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        cp /usr/share/zoneinfo/Asia/Dhaka /etc/localtime
        echo Asia/Dhaka > /etc/timezone
        printf '%s\n' \
          '5 0 1 * * curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/monthly-bonus >> /var/log/cron.log 2>&1' \
          '0 0 * * 6 curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/weekly-bonus >> /var/log/cron.log 2>&1' \
          > /etc/crontabs/root
        crond -f -l 2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: docker_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped